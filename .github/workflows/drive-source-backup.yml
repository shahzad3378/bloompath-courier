name: Back up source to Google Drive

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 22 * * *" # 02:00 Dubai time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-source-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Drive authorization
        id: drive-auth
        run: |
          if [ -z "$GOOGLE_DRIVE_OAUTH_JSON" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the GOOGLE_DRIVE_OAUTH_JSON repository secret to enable Drive backups."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
      - name: Install Drive API client
        if: steps.drive-auth.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Create and upload dated source archive
        if: steps.drive-auth.outputs.enabled == 'true'
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: python .github/scripts/drive_source_backup.py
